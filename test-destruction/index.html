<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Destruction test — battleship damage rig</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f14; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 10px; left: 12px; z-index: 10;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cfe6ff; white-space: pre; pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.85);
    }
    /* mirrors #navbtns on the main page, so the trip back looks like the trip out */
    #navbtns {
      position: fixed; left: 12px; bottom: 12px; z-index: 15; display: flex; gap: 8px;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; user-select: none;
    }
    #navbtns a {
      font: inherit; color: #cfe6ff; background: rgba(8,14,20,0.78); text-decoration: none;
      border: 1px solid #2c4256; border-radius: 6px; padding: 7px 12px; cursor: pointer;
      backdrop-filter: blur(3px); letter-spacing: 0.02em;
    }
    #navbtns a:hover { background: #21374a; border-color: #4d9fd6; }
    #err {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 20; display: none;
      font: 12px/1.5 ui-monospace, monospace; color: #ffd7d7;
      background: rgba(60,0,0,0.84); border: 1px solid #a33; border-radius: 6px;
      padding: 10px 12px; white-space: pre-wrap; max-height: 42vh; overflow: auto;
    }

    /* --- instrument panel --- */
    #rig {
      position: fixed; right: 10px; top: 10px; bottom: 10px; width: 268px; z-index: 15;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cfe6ff; background: rgba(8,14,20,0.82); border: 1px solid #24384a;
      border-radius: 6px; backdrop-filter: blur(3px); user-select: none;
      padding: 8px 10px; overflow-y: auto;
    }
    #rig .rig-summary {
      padding: 4px 2px 8px; color: #9fc4e0; border-bottom: 1px solid #24384a; margin-bottom: 4px;
    }
    #rig .rig-summary b { color: #6d8ba3; font-weight: 400; }
    #rig .rig-group {
      padding: 8px 2px 3px; color: #6d8ba3; text-transform: uppercase;
      font-size: 9px; letter-spacing: 0.09em;
    }
    #rig .rig-row { display: flex; align-items: center; gap: 6px; padding: 1px 2px; }
    #rig .rig-name { width: 78px; flex: none; color: #a9c6de; }
    #rig .rig-bar {
      position: relative; flex: 1; height: 8px; background: #16242f;
      border: 1px solid #2c4256; border-radius: 2px; overflow: hidden;
    }
    #rig .rig-bar i {
      position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
      background: #7fd4a0; transition: width 120ms linear;
    }
    #rig .rig-bar i.rig-flood {
      background: repeating-linear-gradient(135deg, #2f6fa8 0 3px, #1d4a72 3px 6px);
      opacity: 0.85; bottom: auto; height: 3px;
    }
    #rig .rig-val { width: 58px; flex: none; text-align: right; font-size: 10px; }
    #rig .rig-fire .rig-name { animation: burn 0.9s steps(2, end) infinite; }
    @keyframes burn { 0%, 50% { color: #ff8a4a; } 51%, 100% { color: #a9c6de; } }
    #rig .rig-log {
      padding: 2px 2px; font-size: 10px; line-height: 1.45; white-space: pre;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="navbtns"><a href="/" title="Back to the ocean sim">← Back to ocean</a></div>
  <script type="module" src="/src/testDestruction/main.js"></script>
</body>
</html>
