<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FFT Ocean — Claude (WebGPU)</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f14; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 10px; left: 12px; z-index: 10;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cfe6ff; white-space: pre; pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.85);
    }
    #navbtns {
      position: fixed; left: 12px; bottom: 12px; z-index: 15; display: flex; gap: 8px;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; user-select: none;
    }
    #navbtns button {
      font: inherit; color: #cfe6ff; background: rgba(8,14,20,0.78);
      border: 1px solid #2c4256; border-radius: 6px; padding: 7px 12px; cursor: pointer;
      backdrop-filter: blur(3px); letter-spacing: 0.02em;
    }
    #navbtns button:hover { background: #21374a; border-color: #4d9fd6; }
    #navbtns button:active { background: #16242f; }
    /* The fx panel is not built by default any more; these rules are here for
       poseidon.showFxPanel() from the console. */
    #fxpanel {
      position: fixed; left: 12px; bottom: 56px; z-index: 15; width: 232px;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cfe6ff; background: rgba(8,14,20,0.78); border: 1px solid #24384a;
      border-radius: 6px; backdrop-filter: blur(3px); user-select: none;
    }
    #fxpanel .fx-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 8px; cursor: pointer; font-weight: 600; letter-spacing: 0.02em;
      border-bottom: 1px solid #24384a; color: #eaf4ff;
    }
    #fxpanel.fx-collapsed .fx-head { border-bottom: none; }
    #fxpanel.fx-collapsed .fx-body { display: none; }
    #fxpanel .fx-body { padding: 4px 0 6px; max-height: 62vh; overflow-y: auto; }
    #fxpanel .fx-group {
      padding: 6px 8px 2px; color: #6d8ba3; text-transform: uppercase;
      font-size: 9px; letter-spacing: 0.08em;
    }
    #fxpanel .fx-row {
      display: flex; align-items: center; gap: 6px; padding: 2px 8px; cursor: pointer;
    }
    #fxpanel .fx-row:hover { background: rgba(90,140,190,0.16); }
    #fxpanel .fx-row input { margin: 0; accent-color: #4d9fd6; width: 12px; height: 12px; }
    #fxpanel .fx-buttons { display: flex; gap: 6px; padding: 8px 8px 2px; }
    #fxpanel .fx-buttons button {
      flex: 1; font: inherit; color: #cfe6ff; background: #16242f;
      border: 1px solid #2c4256; border-radius: 4px; padding: 3px 0; cursor: pointer;
    }
    #fxpanel .fx-buttons button:hover { background: #21374a; }
    #err {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 20; display: none;
      font: 12px/1.5 ui-monospace, monospace; color: #ffd7d7;
      background: rgba(60,0,0,0.84); border: 1px solid #a33; border-radius: 6px;
      padding: 10px 12px; white-space: pre-wrap; max-height: 42vh; overflow: auto;
    }
  </style>
</head>
<body>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
